<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الأصدقاء</title>
<meta name="theme-color" content="#32104F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri&family=Cairo:wght@600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#32104F;          /* dark purple: the page */
  --plum:#492269;         /* secondary dark purple: separation */
  --sky:#8CCFFF;          /* light blue: progress and primary actions */
  --paper:#FFFFFF;        /* white: sheets, forms */
  --muted:#5B4573;        /* secondary text on white */
  --on-ink-soft:rgba(255,255,255,.76);
  --line-dark:rgba(255,255,255,.18);
  --line-light:#DDD5E5;
  --field:#7D6791;
  --err:#B3261E;
  --ghost:rgba(140,207,255,.24);
  --gut:clamp(1rem,4vw,2.5rem);
  --font-ui:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --font-display:"Cairo","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --font-verse:"Amiri","Scheherazade New","Noto Naskh Arabic","Traditional Arabic",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--ink);color-scheme:dark;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--ink);color:#fff;font:400 1rem/1.6 var(--font-ui);display:flex;flex-direction:column}
main{flex:1 0 auto}
main:focus,main:focus-visible{outline:none}
a{color:inherit}
h1,h2,h3,p,dl,dd,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.sheet :focus-visible,.dlg :focus-visible{outline-color:var(--ink)}
.wrap{width:min(100% - 2 * var(--gut),72rem);margin-inline:auto}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0;background:var(--sky);color:var(--ink);padding:.6rem 1rem;z-index:50;font-weight:600}
.skip:focus{left:.5rem;top:.5rem}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);border-bottom:1px solid var(--line-dark)}
.top-in{display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 1rem;padding-block:.55rem 0}
.mark{font:800 1.85rem/1.3 var(--font-display);color:var(--sky);text-decoration:none;direction:rtl;unicode-bidi:isolate;justify-self:start}
.top-in .btn{grid-column:2;grid-row:1}
.nav{grid-column:1 / -1;grid-row:2;display:flex;gap:1.6rem}
.nav a{font:600 .95rem/1 var(--font-display);text-decoration:none;color:var(--on-ink-soft);padding:.8rem 0 .7rem;border-bottom:3px solid transparent}
.nav a:hover{color:#fff}
.nav a[aria-current=page]{color:#fff;border-bottom-color:var(--sky)}
@media(min-width:720px){
  .top-in{grid-template-columns:auto 1fr auto;padding-block:.45rem}
  .nav{grid-column:2;grid-row:1;margin-inline-start:2.25rem;align-self:stretch;align-items:flex-end}
  .top-in .btn{grid-column:3}
  .nav a{padding-block:1.05rem .8rem}
}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:48px;padding:.6rem 1.4rem;border-radius:999px;border:2px solid transparent;font:700 1rem/1.1 var(--font-display);text-decoration:none;text-align:center;transition:background-color .15s,border-color .15s,color .15s}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn-sm{min-height:40px;padding:.4rem 1.1rem;font-size:.95rem}
.btn-sky{background:var(--sky);color:var(--ink)}
.btn-sky:hover:not([disabled]){background:#A9DBFF}
.btn-line{border-color:rgba(255,255,255,.55);color:#fff;background:transparent}
.btn-line:hover{border-color:#fff}
.sheet .btn-sky,.dlg .btn-sky{box-shadow:inset 0 0 0 2px var(--ink)}
.btn-ink{background:var(--ink);color:#fff}
.btn-ink:hover{background:var(--plum)}
.btn-edge{border-color:var(--ink);color:var(--ink);background:transparent}
.btn-edge:hover{background:#F3EEF7}
.btn-danger{border-color:var(--err);color:var(--err);background:transparent}
.btn-danger:hover{background:#FCEDEC}
.btn-danger-solid{background:var(--err);color:#fff}
.btn-text{background:none;border:0;padding:.5rem 0;font:600 1rem/1.3 var(--font-ui);text-decoration:underline;text-underline-offset:3px;cursor:pointer;color:inherit}
.btn-text:hover{text-decoration-thickness:2px}

/* ---------- notices ---------- */
.notice{background:var(--plum);border-bottom:1px solid var(--line-dark);font-size:.95rem}
.notice .wrap{display:flex;flex-wrap:wrap;gap:.25rem 1.25rem;align-items:center;justify-content:space-between;padding-block:.55rem}
.notice .btn-text{color:var(--sky)}

/* ---------- gauge: the number is the vessel ---------- */
.gauge{--num-size:min(42vw,13rem);pointer-events:none;display:flex;align-items:flex-start;width:max-content;max-width:100%;border-radius:1rem}
.vessel{
  display:block;font:900 var(--num-size)/1 var(--font-display);letter-spacing:-.02em;
  --cut:calc(13.4% + var(--lv,0) * .665%);
  background:linear-gradient(to top,var(--sky) 0,var(--sky) var(--cut),var(--ghost) var(--cut),var(--ghost) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
}
.vessel.full{background:var(--sky);-webkit-background-clip:text;background-clip:text}
.gauge .pct{font:800 calc(var(--num-size) * .24)/1 var(--font-display);color:var(--sky);margin-top:calc(var(--num-size) * .2);margin-inline-start:.06em}
@keyframes halo{0%{filter:drop-shadow(0 0 0 rgba(140,207,255,0))}35%{filter:drop-shadow(0 0 2.4rem rgba(140,207,255,.6))}100%{filter:drop-shadow(0 0 0 rgba(140,207,255,0))}}
.gauge.halo{animation:halo 1.9s ease-out 1}
@media(min-width:900px){.gauge{--num-size:15rem}}

/* ---------- home: the level board ---------- */
.sheet{background:var(--paper);color:var(--ink);color-scheme:light}
.bp-head{padding-block:1.4rem 0}
.bp-head .page-title{font-size:clamp(1.8rem,5vw,2.4rem)}
.bp-sub{margin-top:.5rem;color:var(--on-ink-soft);max-width:38rem}
.toolbar{display:grid;gap:.7rem;margin-top:1.1rem;padding:.8rem;border-radius:18px}
.toolbar[hidden]{display:none}
.search{width:100%;min-height:48px;padding:.6rem 1rem;border:1.5px solid var(--field);border-radius:12px;background:#fff;color:var(--ink)}
.search::placeholder{color:#7a6b8b}
.search:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--sky);outline:none}
.sorts{display:flex;flex-wrap:wrap;gap:.5rem}
.sorts button{min-height:40px;padding:.3rem 1rem;border-radius:999px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);font:600 .92rem var(--font-display)}
.sorts button[aria-pressed=true]{background:var(--sky);box-shadow:inset 0 0 0 1.5px var(--ink)}
@media(max-width:719px){.sorts{flex-wrap:nowrap;overflow-x:auto}.sorts button{flex:none;padding:.3rem .8rem;font-size:.88rem}}
@media(min-width:720px){.toolbar{grid-template-columns:minmax(14rem,22rem) 1fr;align-items:center}}
@media(min-width:900px){.bp-top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;column-gap:2rem}.bp-top .toolbar{margin-top:0;grid-template-columns:minmax(12rem,16rem) auto}}

.cards{container-type:inline-size;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem;margin:1.2rem 0 3rem}
.card{--ns:3.8rem;position:relative;min-height:calc((100cqw - .8rem) / 2 * 1.4);display:flex;flex-direction:column;gap:.4rem;background:#fff;color:var(--ink);border-radius:14px;padding:1rem 1rem 1.1rem;text-decoration:none;transition:transform .2s ease,box-shadow .2s ease}
.card::before{content:"";position:absolute;inset:6px;border:1px solid rgba(50,16,79,.16);border-radius:9px;pointer-events:none}
.card.add::before{border-color:rgba(255,255,255,.22)}
.mirror{display:none}
.card:hover,.card:focus-visible{box-shadow:0 0 0 3px var(--sky);outline:none}
@media(hover:hover){.card:hover{transform:translateY(-4px)}}
.card:active{transform:scale(.985)}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.cards.in .card{animation:cardIn .55s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(min(var(--i,0), 8) * 80ms)}
.card-top{display:flex;flex-direction:column;gap:.4rem}
.card-top .tag{align-self:flex-start;white-space:nowrap;font:600 .75rem/1.2 var(--font-display);padding:.2rem .6rem;border-radius:999px;border:1.5px solid #B9AAC8;color:var(--muted)}
.card-top .tag.hot{background:var(--sky);color:var(--ink);border-color:var(--ink)}
.num-row{display:flex;align-items:flex-end;gap:.5rem}
.card .gauge{--num-size:var(--ns);margin:0;flex:none;justify-content:space-between;width:calc(var(--ns) * (var(--dg,2) * .54 + .24))}
.card .vessel{background:linear-gradient(to top,var(--ink) 0,var(--ink) var(--cut),rgba(50,16,79,.14) var(--cut),rgba(50,16,79,.14) 100%);-webkit-background-clip:text;background-clip:text}
.card .vessel.full{background:var(--ink);-webkit-background-clip:text;background-clip:text}
.card .gauge .pct{color:var(--ink)}
.owner-chip{display:flex;flex-direction:column;flex:0 1 auto;min-width:0;align-self:flex-end;margin-bottom:calc(var(--ns) * .13);background:var(--ink);color:var(--sky);border-radius:9px;padding:.22rem .42rem;font:700 .75rem/1.2 var(--font-display)}
.owner-chip .oc-l{display:none}
.owner-chip .oc-n{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.funded{align-self:flex-end;padding-bottom:calc(var(--ns) * .1);font:600 .95rem/1.2 var(--font-display);color:var(--muted)}
.card-main{display:flex;flex-direction:column;gap:.3rem;flex:1}
.card-main>span{display:block}
.card-title{font:800 1.1rem/1.25 var(--font-display);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-for{font-weight:600;font-size:.92rem}
.card-main>.card-desc{display:none}
.card-need{font-size:.88rem;margin-top:auto;padding-top:.2rem;color:var(--muted)}
.card-need b{color:var(--ink)}
.cta{margin-top:auto;text-align:center;background:var(--ink);color:#fff;font:700 .9rem var(--font-display);padding:.6rem;border-radius:999px}
.card.add{background:var(--plum);color:#fff;padding:1.1rem;justify-content:space-between}
.card.add .add-t,.card.add .add-s{display:block}
.card.add .add-t{font:800 1.15rem/1.2 var(--font-display)}
.card.add .add-s{color:var(--on-ink-soft);margin-top:.35rem;font-size:.88rem}
.card.add .cta{background:var(--sky);color:var(--ink)}
@media(min-width:720px){
  .cards{grid-template-columns:repeat(2,minmax(0,20rem));justify-content:start;gap:1.2rem;margin-bottom:3.5rem}
  .card{--ns:6.2rem;min-height:28rem;border-radius:18px;padding:1.3rem 1.3rem 1.4rem;gap:.5rem}
  .card::before{inset:7px;border-radius:12px}
  .mirror{display:block;position:absolute;right:1.35rem;bottom:1.2rem;transform:rotate(180deg);font:900 1.5rem/1 var(--font-display);color:var(--ink);pointer-events:none}
  .card-top .tag{font-size:.8rem}
  .owner-chip{font-size:.9rem;padding:.35rem .65rem;border-radius:12px;margin-bottom:calc(var(--ns) * .1)}
  .owner-chip .oc-l{display:block;font-size:.72rem;font-weight:600;opacity:.8}
  .card-title{font-size:1.32rem}
  .card-for{font-size:1.02rem}
  .card-main>.card-desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:.96rem}
  .card-need{font-size:.98rem;padding-right:4rem}
  .cta{padding:.7rem;font-size:.95rem}
  .card.add{padding:1.3rem}
  .card.add .add-t{font-size:1.3rem}
}
@media(min-width:900px){.cards{grid-template-columns:repeat(3,minmax(0,20rem))}}
.empty-note{padding-block:2rem 4rem;max-width:32rem;color:var(--on-ink-soft)}
.lead-empty{padding-block:1.5rem 2.5rem;max-width:34rem}
.lead-empty h2{font:800 1.6rem/1.2 var(--font-display)}
.lead-empty p{margin-top:.5rem;color:var(--on-ink-soft)}
.lead-empty .btn{margin-top:1.1rem}

/* ---------- detail ---------- */
.back{position:relative;z-index:2;display:inline-flex;align-items:center;gap:.5rem;margin-top:1.1rem;min-height:44px;padding:.4rem 1.2rem .4rem .95rem;border:2px solid rgba(255,255,255,.55);border-radius:999px;color:#fff;text-decoration:none;font:700 .98rem var(--font-display)}
.back::before{content:"\2039";font-size:1.7rem;line-height:1;margin-top:-.2rem}
.back:hover{border-color:#fff;background:rgba(255,255,255,.08)}
.d-grid{display:grid;gap:1.5rem;padding-block:1.25rem 3.5rem}
.status{font:600 1rem/1.3 var(--font-display);color:var(--sky)}
.col-b h1{font:800 clamp(1.8rem,5vw,2.9rem)/1.12 var(--font-display);margin-top:.3rem}
.col-b .for{margin-top:.6rem;font:600 1.15rem var(--font-ui)}
.col-b .dated{color:var(--on-ink-soft);font-size:.95rem}
.col-b .story{margin-top:1rem;max-width:38rem;font-size:1.05rem;color:rgba(255,255,255,.88);white-space:pre-line}
.figs{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid var(--line-dark);margin-block:1.6rem}
.figs>div{padding:1rem .5rem 1rem 0}
.figs>div+div{padding-left:1rem;border-left:1px solid var(--line-dark)}
.figs dt{font-size:.9rem;color:var(--on-ink-soft)}
.figs dd{font:800 1.4rem/1.2 var(--font-display)}
.figs small{display:block;font:600 .78rem var(--font-ui);color:var(--on-ink-soft)}
.give{border-radius:22px;padding:1.5rem}
.give h2{font:800 1.45rem/1.2 var(--font-display)}
.give .note{margin-top:.4rem;color:var(--muted);font-size:.96rem}
.chips{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:1.2rem;border:0;padding:0;min-width:0}
.chips legend{padding:0;margin-bottom:.6rem;font-weight:600;font-size:.95rem}
.chip{min-height:46px;min-width:3.4rem;padding:.35rem 1.05rem;border-radius:999px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);font:700 1rem var(--font-display)}
.chip:hover{background:#F3EEF7}
.chip[aria-pressed=true]{background:var(--sky);box-shadow:inset 0 0 0 1.5px var(--ink)}
.field{margin-top:1.3rem}
.field label{display:block;font-weight:600;margin-bottom:.4rem}
.field input[type=text],.field input[type=tel],.field input[type=number],.field input[type=date],.field textarea{width:100%;min-height:52px;padding:.7rem 1rem;border:1.5px solid var(--field);border-radius:12px;background:#fff;color:var(--ink)}
.field textarea{resize:vertical;min-height:7rem;line-height:1.5}
.field input:focus,.field textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--sky);outline:none}
.field .bad{border-color:var(--err)}
.help{font-size:.9rem;color:var(--muted);margin-top:.35rem}
.err{min-height:0;margin-top:.35rem;font-size:.92rem;color:var(--err);font-weight:600}
.err:empty{display:none}
.amt-input{position:relative}
.amt-input input{padding-inline-end:4rem !important}
.amt-input span{position:absolute;inset-block:0;right:1rem;display:flex;align-items:center;font-weight:700;color:var(--muted);pointer-events:none}
.give .btn{width:100%;margin-top:1.1rem}
.give .btn-text{display:block;margin-top:.7rem;color:var(--ink)}
.give-done h2{font:800 1.45rem/1.2 var(--font-display)}
.give-done p{margin-top:.5rem;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;margin-top:1.5rem}
.tools .btn-text{color:#fff}
.tools .danger{color:#FFB4AE}
@media(min-width:900px){
  .d-grid{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:3.5rem;align-items:start;padding-block:1.5rem 4.5rem}
  .d-grid .col-a{position:sticky;top:calc(5.5rem + env(safe-area-inset-top,0px))}
}

/* ---------- completed ---------- */
.page-head{padding-block:1.5rem .5rem}
.page-title{font:800 clamp(2rem,6vw,3.4rem)/1.1 var(--font-display)}
.page-sub{margin-top:.6rem;color:var(--on-ink-soft);max-width:36rem;font-size:1.05rem}
.done-list{margin-top:2rem;padding-bottom:3.5rem;border-bottom:1px solid var(--line-dark)}
.done-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.15rem 1.25rem;padding:1.15rem .25rem;border-top:1px solid var(--line-dark);text-decoration:none}
.done-item:hover{background:rgba(255,255,255,.05)}
.done-item .t{font:700 1.2rem/1.25 var(--font-display)}
.done-item .f{color:var(--on-ink-soft);font-size:.95rem}
.done-item .a{font:800 1.2rem/1.25 var(--font-display);text-align:right;white-space:nowrap}
.done-item .d{color:var(--on-ink-soft);font-size:.92rem;text-align:right;white-space:nowrap}
.done-empty{padding-block:2rem 4rem;max-width:32rem;color:var(--on-ink-soft)}

/* ---------- form view ---------- */
.form-wrap{padding-bottom:3.5rem}
.form{border-radius:24px;padding:1.5rem 1.35rem 1.75rem;margin-top:1.75rem;max-width:42rem}
.form .field:first-child{margin-top:0}
.field .meta{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start}
.field .meta span{font-size:.88rem;color:var(--muted);margin-top:.35rem;white-space:nowrap}
.amt-row{display:block}
.rng{margin-top:.9rem}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;--p:0%;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:6px;background:linear-gradient(to right,var(--sky) 0,var(--sky) var(--p),var(--ink) var(--p),var(--ink) 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;box-sizing:border-box;width:30px;height:30px;margin-top:-10px;border-radius:50%;background:#fff;border:5px solid var(--ink)}
input[type=range]::-moz-range-track{height:10px;border-radius:6px;background:var(--ink)}
input[type=range]::-moz-range-progress{height:10px;border-radius:6px;background:var(--sky)}
input[type=range]::-moz-range-thumb{box-sizing:border-box;width:30px;height:30px;border-radius:50%;background:#fff;border:5px solid var(--ink)}
.rng-scale{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.form-actions{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.5rem;margin-top:1.8rem}
.form-actions .btn{min-width:11rem}
.form-actions .btn-text{color:var(--ink)}
.readonly-note{margin-top:1.75rem;max-width:36rem;color:var(--on-ink-soft)}

/* ---------- intro screen ---------- */
.intro-screen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(1rem,4vh,2rem);padding:calc(2rem + env(safe-area-inset-top,0px)) 1.5rem calc(2rem + env(safe-area-inset-bottom,0px));background:var(--ink);text-align:center;overflow:auto;transition:opacity .4s ease}
.intro-screen.leaving{opacity:0;pointer-events:none}
.in-word{--lv:0;margin:0;font:900 clamp(4.5rem,20vw,14rem)/1.5 var(--font-display);direction:rtl;unicode-bidi:isolate;pointer-events:none;
  background:linear-gradient(to top,var(--sky) 0,var(--sky) calc(var(--lv) * 1%),var(--ghost) calc(var(--lv) * 1%),var(--ghost) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.in-word.full{background:var(--sky);-webkit-background-clip:text;background-clip:text}
.in-verse{margin:0;max-width:20ch;font:400 clamp(1.6rem,5.2vw,2.5rem)/1.9 var(--font-verse);color:#fff;direction:rtl;text-wrap:balance;pointer-events:none}
.in-enter{min-width:12rem;min-height:54px;margin-top:.5rem;font-size:1.1rem}
@keyframes rise{from{opacity:0;transform:translateY(.6rem)}to{opacity:1;transform:none}}
.in-verse,.in-enter{animation:rise .9s ease 1s both}

/* ---------- case owner, photos, amount ---------- */
.opt{font-weight:400;color:var(--muted)}
.field .amt-big input[type=text]{font:900 2rem/1.1 var(--font-display);min-height:66px}
.adders{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.75rem}
.adders button{min-height:42px;padding:.3rem .9rem;border-radius:999px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);font:700 .95rem var(--font-display)}
.adders button:hover{background:#F3EEF7}

/* =====================================================
   Storage backends: shared (db capability) or this device (localStorage)
   ===================================================== */
function localBackend() {
  const KEY = 'alasdiqa:v1';
  let data = null, cb = null;
  try { const raw = localStorage.getItem(KEY); if (raw) data = JSON.parse(raw); } catch (e) { data = null; }
  if (!data || !Array.isArray(data.requests) || !Array.isArray(data.gifts)) data = sampleData();
  const sampleOwners = { s1: 'Nadia', s2: 'Karim', s3: 'Layla', s4: 'Samir' };
  data.requests.forEach((r) => { if (r.sample && !r.owner && sampleOwners[r.id]) r.owner = sampleOwners[r.id]; });
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); return true; } catch (e) { return false; } };
  const canPersist = persist();
  const emit = (skip) => { if (!skip) persist(); cb && cb({ requests: data.requests.slice(), gifts: data.gifts.slice() }); };
  return {
    kind: 'local',
    subscribe(fn) { cb = fn; emit(true); },
    async saveRequest(r) {
      const prev = data.requests.slice();
      const i = data.requests.findIndex((x) => x.id === r.id);
      if (i >= 0) data.requests[i] = r; else data.requests.push(r);
      if (canPersist && !persist()) { data.requests = prev; throw { code: 'quota_exceeded' }; }
      emit(true);
    },
    async removeRequest(id) { data.requests = data.requests.filter((r) => r.id !== id); data.gifts = data.gifts.filter((g) => g.rid !== id); emit(); },
    async removeMany(ids) { const s = new Set(ids); data.requests = data.requests.filter((r) => !s.has(r.id)); data.gifts = data.gifts.filter((g) => !s.has(g.rid)); emit(); },
    async addGift(g) { data.gifts.push(g); emit(); },
    async removeGift(id) { data.gifts = data.gifts.filter((g) => g.id !== id); emit(); },
  };
}

function sharedBackend(db) {
  const reqCol = db.collection('requests');
  const giftCol = db.collection('gifts');
  let reqs = [], gifts = [], gotR = false, gotG = false, cb = null;
  const emit = () => { if (gotR && gotG && cb) cb({ requests: reqs, gifts }); };
  const body = (o) => { const c = Object.assign({}, o); delete c.id; return c; };
  return {
    kind: 'shared',
    subscribe(fn, onError) {
      cb = fn;
      reqCol.onSnapshot((s) => { reqs = s.docs.map((d) => Object.assign({ id: d.id }, d.data())); gotR = true; emit(); }, onError);
      giftCol.onSnapshot((s) => { gifts = s.docs.map((d) => Object.assign({ id: d.id }, d.data())); gotG = true; emit(); }, onError);
    },
    async saveRequest(r) { await db.doc('requests/' + r.id).set(body(r)); },
    async removeRequest(id) {
      const mine = gifts.filter((g) => g.rid === id);
      for (const g of mine) await db.doc('gifts/' + g.id).delete();
      await db.doc('requests/' + id).delete();
    },
    async removeMany(ids) { for (const id of ids) await this.removeRequest(id); },
    async addGift(g) { await db.doc('gifts/' + g.id).set(body(g)); },
    async removeGift(id) { await db.doc('gifts/' + id).delete(); },
  };
}

/* Google Apps Script backend. This works when this HTML is served by Apps Script HtmlService. */
function appsScriptBackend() {
  const runner = () => google.script.run;
  let cb = null, timer = null, lastSig = '';
  const call = (method, arg) => new Promise((resolve, reject) => {
    let r = runner().withSuccessHandler(resolve).withFailureHandler((e) => reject(e || new Error('Google Sheets request failed')));
    if (arg === undefined) r[method](); else r[method](arg);
  });
  const refresh = async () => {
    try {
      const payload = await call('getSharedData');
      const sig = JSON.stringify(payload);
      if (sig !== lastSig) { lastSig = sig; if (cb) cb(payload); }
    } catch (e) { if (S) { S.error = 'sheets_error'; renderNotice(); } }
  };
  return {
    kind: 'sheets',
    subscribe(fn, onError) { cb = fn; refresh(); timer = setInterval(refresh, 12000); },
    async saveRequest(r) { return call('createRequest', r); },
    async addGift(g) { return call('recordContribution', g); },
    async removeRequest() { throw { code: 'invalid_argument' }; },
    async removeMany() { throw { code: 'invalid_argument' }; },
    async removeGift() { throw { code: 'invalid_argument' }; },
  };
}

/* Vercel API backend: /api/sheets proxies requests to the Apps Script web app. */
function vercelSheetsBackend() {
  let cb = null, timer = null, lastSig = '';
  const request = async (action, payload) => {
    const options = payload === undefined
      ? { method: 'GET', headers: { 'Accept': 'application/json' } }
      : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, payload }) };
    const url = payload === undefined ? `/api/sheets?action=${encodeURIComponent(action)}` : '/api/sheets';
    const response = await fetch(url, options);
    let data;
    try { data = await response.json(); } catch (_) { throw new Error('The Sheets API returned an unreadable response.'); }
    if (!response.ok || data.ok === false) throw new Error(data.error || 'Google Sheets request failed.');
    return data.result === undefined ? data : data.result;
  };
  const refresh = async () => {
    try {
      const payload = await request('getSharedData');
      const sig = JSON.stringify(payload);
      if (sig !== lastSig) { lastSig = sig; if (cb) cb(payload); }
      if (S) { S.error = ''; renderNotice(); }
    } catch (e) {
      if (S) { S.error = 'sheets_error'; renderNotice(); }
    }
  };
  return {
    kind: 'sheets',
    subscribe(fn) { cb = fn; refresh(); timer = setInterval(refresh, 12000); },
    async saveRequest(r) { return request('createRequest', r); },
    async addGift(g) { return request('recordContribution', g); },
    async removeRequest() { throw new Error('Deleting requests is disabled for public visitors.'); },
    async removeMany() { throw new Error('Deleting requests is disabled for public visitors.'); },
    async removeGift() { throw new Error('Undoing contributions is disabled for public visitors.'); },
  };
}

function dataUrlToBlob(u) {

/* =====================================================
   State and derived figures
   ===================================================== */
const S = { backend: null, kind: 'local', canWrite: true, isAdmin: false, ready: false, error: null, requests: [], gifts: [], items: [], byId: new Map(), total: 0 };
let view = null;
let introOpen = false;

function derive() {
  const gm = new Map();
  for (const g of S.gifts) {
    const amount = Number(g.amount);
    if (!(amount > 0)) continue;
    if (!gm.has(g.rid)) gm.set(g.rid, []);
    gm.get(g.rid).push({ id: g.id, amount, ts: Number(g.ts) || 0 });
  }
  S.items = S.requests.map((r) => {
    const target = Math.max(1, Number(r.target) || 1);
    const gs = (gm.get(r.id) || []).sort((a, b) => a.ts - b.ts);
    let raised = 0, crossed = null;
    for (const g of gs) { raised += g.amount; if (crossed == null && raised >= target) crossed = g.ts; }
    const done = raised >= target;
    return Object.assign({}, r, {
      target, raised, done,
      remaining: Math.max(0, target - raised),
      pct: done ? 100 : Math.min(99, Math.floor((raised / target) * 100)),
      completedAt: done ? (crossed || r.createdAt || 0) : null,
      createdAt: Number(r.createdAt) || 0,
    });
  });
  S.byId = new Map(S.items.map((i) => [i.id, i]));
  S.total = S.items.reduce((n, i) => n + i.raised, 0);
}

function onData(payload) {
  S.requests = payload.requests || [];
  S.gifts = payload.gifts || [];
  S.ready = true;
  derive();
  renderNotice();
  if (view) view.update();
}

async function safe(fn) {
  try { await fn(); return true; }
  catch (e) {
    const code = e && e.code;
    if (code === 'invalid_argument') toast('You can read requests here but not change them.');
    else if (code === 'quota_exceeded') toast('Storage is full. Delete old requests to make room.');
    else toast("Couldn't save that. Check your connection and try again.");
    return false;
  }
}

/* =====================================================
   Gauge: the percentage is a vessel that fills
   ===================================================== */
const shown = new Map();
function setGauge(el, key, target, opts = {}) {
  const num = $('.vessel', el);
  const from = shown.has(key) ? shown.get(key) : 0;
  el.setAttribute('aria-label', target + ' percent funded');
  cancelAnimationFrame(el._raf);
  const paint = (v) => {
    num.textContent = String(Math.round(v));
    num.style.setProperty('--lv', v.toFixed(2));
    num.classList.toggle('full', v >= 100);
  };
  const finish = () => {
    shown.set(key, target);
    if (opts.celebrate && target === 100) { el.classList.add('halo'); setTimeout(() => el.classList.remove('halo'), 2100); }
  };
  if (opts.hold) { paint(0); shown.set(key, 0); return; }
  if (opts.animate === false || reduceMotion || from === target) { paint(target); finish(); return; }
  const t0 = performance.now(), dur = Math.min(1200, 500 + Math.abs(target - from) * 9);
  paint(from);
  const step = (now) => {
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    paint(from + (target - from) * e);
    if (p < 1) el._raf = requestAnimationFrame(step); else finish();
  };
  el._raf = requestAnimationFrame(step);
}
const gaugeHTML = (id) => `<div class="gauge" id="${id}" role="img"><span class="vessel" aria-hidden="true">0</span><span class="pct" aria-hidden="true">%</span></div>`;
let fontsReady = false;
if (document.fonts && document.fonts.ready) {

    const next = [S.canWrite, nq, sort, all.length, closest, newest, rows.map(fields).join('||')].join('##');
    if (next === sig) return;
    sig = next;
    const total = all.length;
    const raisedTotal = all.reduce((sum, item) => sum + item.raised, 0);
    const neededTotal = all.reduce((sum, item) => sum + item.remaining, 0);
    $('#sumOpen').textContent = String(total);
    $('#sumRaised').textContent = egp(raisedTotal);
    $('#sumNeeded').textContent = egp(neededTotal);
    $('#overview').hidden = !S.ready;
    $('#toolbar').hidden = total === 0;
    $('#bpSub').textContent = nq
      ? `${rows.length} ${plural(rows.length, 'match', 'matches')}.`
      : total ? `${total} open ${plural(total, 'request', 'requests')}. Tap one to read it and record a contribution.` : '';
    if (!total) {
      boardEl.innerHTML = `<div class="lead-empty"><h2>No open requests right now.</h2><p>When a friend needs help, post it here and everyone can see how it is going.</p>${S.canWrite ? '<a class="btn btn-sky" href="#/new">New request</a>' : ''}</div>`;
      return;
    }
    if (nq && !rows.length) { boardEl.innerHTML = `<p class="empty-note">Nothing matches "${esc(q)}". Try a different name or word.</p>`; return; }
    const tagOf = (i) => i.id === closest ? ['Closest to done', true] : i.id === newest ? ['Newest', true] : [fmtDate(i.date), false];
    const cards = rows.map((i, n) => cardHTML(i, tagOf(i), n));
    if (!nq && S.canWrite) cards.push('<a class="card add" href="#/new" style="--i:' + rows.length + '"><span><span class="add-t">Someone needs help?</span><span class="add-s">Add a request so the group can see it.</span></span><span class="cta">New request</span></a>');
    const play = !introOpen && !played;
    if (play) played = true;
    boardEl.innerHTML = '<div class="cards' + (play ? ' in' : '') + '">' + cards.join('') + '</div>';
    $$('.gauge[data-g]', boardEl).forEach((g) => setGauge(g, 'cell:' + g.dataset.g, Number(g.dataset.pct), { animate: fontsReady, hold: introOpen }));
  }

  return {
    update: render,
    replayLead() { sig = ''; played = false; render(); },
    destroy() {},
  };
}

  function drawPreview() {
    const it = S.byId.get(id), pv = $('#amtPreview'); if (!it || !pv) return;

  }
  async function onGiveChange(e) {
    if (e.target.id !== 'rcFile') return;
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f) return;
    const err = $('#rcErr'); err.textContent = '';

  }
  function onGiveClick(e) {
    const it = S.byId.get(id); if (!it) return;
    const add = e.target.closest('[data-add]');
    if (add) {
      const v = Number(add.dataset.add);
      if (!v) { setAmt(0); return; }

      if (n > it.remaining) setAmt(it.remaining, `Only ${egp(it.remaining)} is still needed, so the amount was set to that.`); else setAmt(n);
      return;
    }
    if (e.target.closest('[data-all]')) { setAmt(it.remaining); return; }
    if (e.target.closest('#rcAdd')) { $('#rcFile').click(); return; }
    if (e.target.closest('[data-rcrm]')) { rcImg = null; drawReceipt(); return; }
    if (e.target.closest('#giveBtn')) { doGive(); return; }
    if (e.target.closest('#undoBtn')) { doUndo(); return; }
    const m = lastMine(id), r = m && receiptFor(m.id);
    if (e.target.closest('#rcOpen') && r) { showPhoto(r.img, 'Your transfer receipt'); return; }

    rcImg = null; keepAmt = 0; chipSig = '';

  async function doUndo() {
    const mine = lastMine(id); if (!mine) return;

  }

  function renderExtras(it) {
    const ob = $('#owner');
    if (it.owner) {
      ob.hidden = false;
      ob.innerHTML = `<p class="owner-l">Case owner</p><p class="owner-n" dir="auto">${esc(it.owner)}</p>`
        + (it.phone ? `<p class="owner-p" dir="ltr">${esc(it.phone)}</p><div class="owner-a"><a class="btn btn-line btn-sm" href="https://wa.me/${waNumber(it.phone)}" target="_blank" rel="noopener">Message on WhatsApp</a><a class="btn btn-line btn-sm" href="tel:${esc(String(it.phone).replace(/[^\d+]/g, ''))}">Call</a></div>` : '');
    } else { ob.hidden = true; ob.innerHTML = ''; }
    const ps = Array.isArray(it.photos) ? it.photos : [];

    }

  }

  function update() {
    if (!S.ready) { main.innerHTML = loadingHTML(); built = false; return; }
    const it = S.byId.get(id);
    if (!it) {
      built = false;
      main.innerHTML = `<div class="wrap"><a class="back" href="#/">Back to home</a><div class="lead-empty"><h2>This request isn't here.</h2><p>It may have been deleted, or the link is wrong.</p><a class="btn btn-sky" href="#/">See open requests</a></div></div>`;
      return;
    }
    if (!built) build(it);
    document.title = it.title + ' \u2013 \u0627\u0644\u0623\u0635\u062F\u0642\u0627\u0621';
    $('#t').textContent = it.title;
    $('#forx').textContent = it.name;
    $('#dated').textContent = 'Requested ' + fmtDate(it.date);
    $('#story').textContent = it.desc;
    renderExtras(it);
    $('#status').textContent = it.done ? 'Completed ' + fmtTs(it.completedAt) : 'Open';
    $('#figs').innerHTML = `<div><dt>Raised</dt><dd>${fmt(it.raised)}<small>EGP</small></dd></div>
      <div><dt>Still needed</dt><dd>${fmt(it.remaining)}<small>EGP</small></dd></div>
      <div><dt>Goal</dt><dd>${fmt(it.target)}<small>EGP</small></dd></div>`;
    $('#waBtn').href = 'https://wa.me/?text=' + encodeURIComponent(shareText(it));
    $('#detailBar').setAttribute('aria-valuenow', String(it.pct));
    $('#detailFill').style.width = it.pct + '%';
    $('#detailRaised').textContent = egp(it.raised) + ' raised';
    $('#detailPct').textContent = it.pct + '% funded';
    const celebrate = lastDone === false && it.done;
    setGauge($('#g'), 'detail:' + id, it.pct, { animate: fontsReady, celebrate });
    if (celebrate && !selfAction) toast('Goal reached. Thank you all.');
    lastDone = it.done;
    renderGive(it);
  }
  return { update, destroy() {} };
}

const MAX_TARGET = 300000, MAX_PHOTOS = 3, PHOTO_LIMIT = 14000;

/* Shrinks a photo until it is small enough to save, so the app stays fast and storage does not fill up */
function compressImage(file, limit = PHOTO_LIMIT, maxSide = 960) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('read'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('decode'));
      img.onload = () => {
        let side = maxSide, q = 0.72;
        for (let n = 0; n < 40; n++) {
          if (side < 280) break;
          const k = Math.min(1, side / Math.max(img.naturalWidth, img.naturalHeight));
          const c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(img.naturalWidth * k));
          c.height = Math.max(1, Math.round(img.naturalHeight * k));
          const x = c.getContext('2d');
          x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
          const out = c.toDataURL('image/jpeg', q);
          if (out.length <= limit) { resolve(out); return; }
          if (q > 0.45) q -= 0.09; else { side = Math.round(side * 0.8); q = 0.6; }
        }
        reject(new Error('size'));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

      <div class="field"><label for="f-date">Request date</label>
        <input id="f-date" aria-required="true" type="date"><p class="err" id="e-date" role="alert"></p></div>
      <div class="form-actions"><button class="btn btn-sky" id="f-submit" type="button">${editing ? 'Save changes' : 'Publish request'}</button>
        <a class="btn-text" href="${back}">Cancel</a></div>
    </div></div>`;

  const f = { title: $('#f-title'), name: $('#f-name'), desc: $('#f-desc'), date: $('#f-date'), num: $('#f-num'), owner: $('#f-owner'), phone: $('#f-phone'), file: $('#f-photo') };
  const fieldOf = (k) => (k === 'target' ? f.num : f[k]);
  const clearErr = (k) => { const e = $('#e-' + k); if (e) e.textContent = ''; const el = fieldOf(k); if (el && el.classList) { el.classList.remove('bad'); el.removeAttribute('aria-invalid'); } };
  const setErr = (k, msg) => { const e = $('#e-' + k); if (e) e.textContent = msg; const el = fieldOf(k); if (el && el.classList) { el.classList.add('bad'); el.setAttribute('aria-invalid', 'true'); if (e) el.setAttribute('aria-describedby', e.id); } };
  const parseAmt = () => Number(String(f.num.value).replace(/\D/g, '')) || 0;
  const showAmt = (n) => { f.num.value = n ? n.toLocaleString('en-US') : ''; };

  function renderPhotos() {
    $('#phUp').innerHTML = photos.map((src, i) => `<div class="thumb"><img src="${esc(src)}" alt="Photo ${i + 1}"><button type="button" data-rm="${i}" aria-label="Remove photo ${i + 1}">&times;</button></div>`).join('')
      + (photos.length < MAX_PHOTOS ? '<button type="button" class="addph" id="addPh">Add photo</button>' : '');
  }
  $('#phUp').addEventListener('click', (e) => {
    const rm = e.target.closest('[data-rm]');
    if (rm) { photos.splice(Number(rm.dataset.rm), 1); clearErr('photo'); renderPhotos(); return; }
    if (e.target.closest('#addPh')) f.file.click();
  });
  f.file.addEventListener('change', async () => {
    const files = Array.from(f.file.files || []).slice(0, MAX_PHOTOS - photos.length);
    f.file.value = '';
    if (!files.length) return;
    clearErr('photo');
    const btn = $('#addPh'); if (btn) { btn.disabled = true; btn.textContent = 'Preparing...'; }
    for (const file of files) {
      try { photos.push(await compressImage(file)); }
      catch (e) { setErr('photo', e.message === 'size' ? file.name + ' is too detailed to shrink. Try a different photo.' : "Couldn't read " + file.name + '. Try a JPG or PNG photo.'); }
      renderPhotos();
    }
  });

  f.num.addEventListener('input', () => {
    let n = parseAmt();
    clearErr('target');
    if (n > MAX_TARGET) { n = MAX_TARGET; setErr('target', 'The most you can request is 300,000 EGP.'); }
    showAmt(n);
  });
  $('#adders').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-add]'); if (!b) return;
    const add = Number(b.dataset.add);
    clearErr('target');
    if (!add) { showAmt(0); return; }
    const n = parseAmt() + add;
    if (n > MAX_TARGET) { showAmt(MAX_TARGET); setErr('target', 'The most you can request is 300,000 EGP.'); } else showAmt(n);
  });
  f.desc.addEventListener('input', () => { $('#cnt').textContent = f.desc.value.length + '/280'; });
  ['title', 'name', 'desc', 'date', 'owner', 'phone'].forEach((k) => f[k].addEventListener('input', () => clearErr(k)));

  const fill = (r) => {
    f.title.value = r.title || ''; f.name.value = r.name || ''; f.desc.value = r.desc || '';
    f.owner.value = r.owner || ''; f.phone.value = r.phone || ''; f.date.value = r.date || todayISO();
    showAmt(r.target || 0);
    photos = Array.isArray(r.photos) ? r.photos.slice(0, MAX_PHOTOS) : [];
    $('#cnt').textContent = f.desc.value.length + '/280';
    renderPhotos();
  };
  fill({ date: todayISO() });

  async function submitForm() {
    const v = { title: f.title.value.trim(), name: f.name.value.trim(), desc: f.desc.value.trim(), date: f.date.value, target: parseAmt(), owner: f.owner.value.trim(), phone: f.phone.value.trim() };
    let first = null;
    const bad = (k, m) => { setErr(k, m); if (!first) first = fieldOf(k); };
    ['title', 'name', 'desc', 'target', 'date', 'owner', 'phone'].forEach(clearErr);
    if (v.owner.length < 2) bad('owner', 'Add the case owner so friends know who to contact.');
    const digits = v.phone.replace(/\D/g, '');
    if (v.phone && (/[^\d+\s()-]/.test(v.phone) || digits.length < 7 || digits.length > 15)) bad('phone', 'Enter a valid number, for example 01012345678.');
    if (v.title.length < 3) bad('title', 'Say what the help is for, in at least 3 characters.');
    if (v.name.length < 2) bad('name', 'Add the name of the person receiving help.');
    if (v.desc.length < 5) bad('desc', 'Add a short description so friends know what the money is for.');
    if (!(v.target >= 1)) bad('target', 'Enter an amount from 1 to 300,000 EGP.');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(v.date)) bad('date', 'Pick the date of the request.');
    if (first) { first.focus(); return; }
    const prev = editing ? S.byId.get(editId) : null;
    const req = { id: editing ? editId : uid('r'), title: v.title, name: v.name, desc: v.desc, date: v.date, target: v.target, owner: v.owner, phone: v.phone, photos: photos.slice(), createdAt: prev ? prev.createdAt : Date.now() };
    const btn = $('#f-submit'); btn.disabled = true;
    const ok = await safe(() => S.backend.saveRequest(req));
    btn.disabled = false;
    if (!ok) return;
    toast(editing ? 'Changes saved.' : 'Request published.');
    navigate('/r/' + req.id);
  }
  $('#f-submit').addEventListener('click', submitForm);
  $('#f').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'file') { e.preventDefault(); submitForm(); } });

  function update() {
    if (!editing || populated) return;
    if (!S.ready) return;
    const it = S.byId.get(editId);
    if (!it) { main.innerHTML = `<div class="wrap"><a class="back" href="#/">Back to home</a><div class="lead-empty"><h2>This request isn't here.</h2><p>It may have been deleted.</p><a class="btn btn-sky" href="#/">See open requests</a></div></div>`; populated = true; return; }
    populated = true;
    fill(it);
    const n = $('#raisedNote'); n.hidden = false;
    n.textContent = `${egp(it.raised)} has been raised so far. Setting the goal at or below that marks the request complete.`;
  }
  return { update, destroy() {} };
}

/* =====================================================
   Router
   ===================================================== */
/* Navigation is handled inside the page. Embedded previews resolve "#/..." links against the
   parent page, which would navigate the frame away, so links never rely on the address bar. */
let currentPath = location.hash.replace(/^#/, '');
function navigate(path) {
  currentPath = path;
  try { history.pushState(null, '', '#' + path); } catch (e) { /* previews may block this: not needed */ }
  route();
}

function setNav(name) {
  $$('.nav a').forEach((a) => { if (a.dataset.nav === name) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
}
function route() {
  const parts = currentPath.replace(/^\/?/, '').split('/').filter(Boolean);
  const [a, b] = parts;
  if (view && view.destroy) view.destroy();
  document.title = '\u0627\u0644\u0623\u0635\u062F\u0642\u0627\u0621';
  let nav = 'home';
  if (a === 'completed') { nav = 'completed'; view = completedView(); }
  else if (a === 'new') { nav = 'new'; view = formView(null); }
  else if (a === 'edit' && b) { nav = 'new'; view = formView(b); }
  else if (a === 'r' && b) { nav = 'home'; view = detailView(b); }
  else view = homeView();
  setNav(nav);
  window.scrollTo(0, 0);
  view.update();
}
const syncFromUrl = () => { const p = location.hash.replace(/^#/, ''); if (p === currentPath) return; currentPath = p; route(); };
window.addEventListener('hashchange', syncFromUrl);
window.addEventListener('popstate', syncFromUrl);
document.addEventListener('click', (e) => {
  const a = e.target.closest && e.target.closest('a[href^="#"]');
  if (!a || e.defaultPrevented || e.button > 0 || e.metaKey || e.ctrlKey || e.shiftKey) return;
  const h = a.getAttribute('href');
  if (h === '#main') { e.preventDefault(); main.focus({ preventScroll: false }); return; }
  if (h.startsWith('#/')) { e.preventDefault(); navigate(h.slice(1)); }
});

/* =====================================================
   Boot: use shared storage when this view has it, otherwise this device
   ===================================================== */
function showIntro() {
  if (currentPath.replace(/^\/?/, '')) return; // deep links go straight in
  introOpen = true;
  const el = document.createElement('section');
  el.className = 'intro-screen';
  el.setAttribute('aria-label', '\u0627\u0644\u0623\u0635\u062F\u0642\u0627\u0621');
  const bgCopy = $('body > .bg').outerHTML.replace(/id=(["'])g(\d)\1/g, 'id=$1ig$2$1').replace(/url\(#g(\d)\)/g, 'url(#ig$1)');
  el.innerHTML = `${bgCopy}<h1 class="in-word" lang="ar">\u0627\u0644\u0623\u0635\u062F\u0642\u0627\u0621</h1>
    <p class="in-verse" lang="ar">\uFD3F\u0648\u064E\u062A\u064E\u0639\u064E\u0627\u0648\u064E\u0646\u064F\u0648\u0627 \u0639\u064E\u0644\u064E\u0649 \u0627\u0644\u0652\u0628\u0650\u0631\u0651\u0650 \u0648\u064E\u0627\u0644\u062A\u0651\u064E\u0642\u0652\u0648\u064E\u0649\uFD3E</p>
    <button class="btn btn-sky in-enter" type="button">Enter</button>`;
  document.body.appendChild(el);
  const behind = $$('header.top, #notice, main, footer');
  behind.forEach((n) => n.setAttribute('inert', ''));
  document.documentElement.style.overflow = 'hidden';
  const word = $('.in-word', el), btn = $('.in-enter', el);
  let raf = 0;
  const paint = (v) => { word.style.setProperty('--lv', v.toFixed(2)); word.classList.toggle('full', v >= 100); };
  if (reduceMotion) paint(100);
  else {
    paint(0);
    Promise.race([document.fonts && document.fonts.ready, new Promise((r) => setTimeout(r, 1500))]).then(() => {
      const t0 = performance.now(), dur = 1900;
      const step = (now) => {
        const p = Math.min(1, (now - t0) / dur), e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
        paint(e * 100);
        if (p < 1 && introOpen) raf = requestAnimationFrame(step);
      };
      raf = requestAnimationFrame(step);
    });
  }
  btn.focus({ preventScroll: true });
  btn.addEventListener('click', () => {
    if (!introOpen) return;
    introOpen = false;
    cancelAnimationFrame(raf);
    el.classList.add('leaving');
    behind.forEach((n) => n.removeAttribute('inert'));
    document.documentElement.style.overflow = '';
    setTimeout(() => el.remove(), reduceMotion ? 0 : 450);
    window.scrollTo(0, 0);
    if (view && view.replayLead) view.replayLead();
    main.focus({ preventScroll: true });
  });
}

function withTimeout(p, ms) { return Promise.race([p, new Promise((r) => setTimeout(() => r(null), ms))]); }
async function boot() {
  showIntro();
  route();
  if (window.google && google.script && google.script.run) {
    S.backend = appsScriptBackend(); S.kind = 'sheets'; S.canWrite = true; S.isAdmin = false;
    S.backend.subscribe(onData, (err) => { S.error = (err && err.code) || 'error'; renderNotice(); });
  } else if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
    // Production Vercel build uses the serverless API; localStorage is not used as a fake shared database.
    S.backend = vercelSheetsBackend(); S.kind = 'sheets'; S.canWrite = true; S.isAdmin = false;
    S.backend.subscribe(onData);
  } else {
    S.backend = localBackend(); S.kind = 'local'; S.canWrite = true; S.isAdmin = true;
    S.backend.subscribe(onData);
  }
  renderNotice();
}
boot();
})();
</script>
